<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeatherApp</title>
  </head>
  <body>
    <main>
      <div class="weather-container">
        <div class="general-info">
          <h1 class="city-name">Weather Now</h1>
            <p class="temp-value Fahrenheit"></p>
            <button class="button-temp" hidden></button>
          <p class="weather-description"></p>
        </div>
        <form action="#">
          <div class="input-container">
            <input type="text" id="city" placeholder="Search a city" required />
            <button type="submit" class="button-search-city"></button>
          </div>
        </form>
      </div>
      <video class="bg-video" autoplay muted loop playsinline>
    </main>
  </body>
</html>
